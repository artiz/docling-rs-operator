# KEDA scaling on the sum of in-flight requests scraped by Prometheus.
apiVersion: docling.artiz.dev/v1alpha1
kind: DoclingServer
metadata:
  name: docling-keda
spec:
  models:
    storage:
      existingClaim: docling-models     # shared, pre-provisioned RWX claim
  server:
    concurrency: 2
  scaling:
    mode: keda
    minReplicas: 1
    maxReplicas: 10
    targetInFlightPerReplica: 2
    keda:
      prometheusAddress: http://prometheus-operated.monitoring.svc:9090
      pollingInterval: 10
      cooldownPeriod: 180
